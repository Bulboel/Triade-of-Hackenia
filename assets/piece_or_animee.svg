<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Pièce d'or animée">
 <defs>
  <radialGradient id="gold" cx="31%" cy="23%" r="78%">
   <stop offset="0" stop-color="#fff1ac"/><stop offset=".25" stop-color="#fbd86b"/><stop offset=".58" stop-color="#dfa02d"/><stop offset=".83" stop-color="#a96513"/><stop offset="1" stop-color="#f7d77b"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff1a6"/><stop offset=".45" stop-color="#bf771a"/><stop offset="1" stop-color="#6e3d0e"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop stop-color="white" stop-opacity="0"/><stop offset=".48" stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".66"/><stop offset=".53" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
  <clipPath id="face"><circle cx="32" cy="32" r="23"/></clipPath>
 </defs>
 <style>
  .coin{transform-origin:32px 32px;animation:turn 4.6s ease-in-out infinite}
  .glint{animation:glint 4.6s ease-in-out infinite}
  @keyframes turn{0%,9%,91%,100%{transform:scaleX(1)}43%,57%{transform:scaleX(.18)}50%{transform:scaleX(.12)}}
  @keyframes glint{0%,15%,78%,100%{opacity:0;transform:translateX(-46px)}28%{opacity:.8}48%{opacity:0;transform:translateX(45px)}}
  @media(prefers-reduced-motion:reduce){.coin,.glint{animation:none}}
 </style>
 <g class="coin">
  <circle cx="32" cy="33" r="27" fill="#4d2b0c" opacity=".25"/>
  <circle cx="32" cy="32" r="26" fill="url(#edge)" stroke="#7e4b14" stroke-width="1"/>
  <circle cx="32" cy="32" r="23" fill="url(#gold)" stroke="#fff0a4" stroke-width="1.1"/>
  <circle cx="32" cy="32" r="19.6" fill="none" stroke="#975c15" stroke-width="1.2" opacity=".8"/>
  <circle cx="32" cy="32" r="17.8" fill="none" stroke="#ffe392" stroke-width=".8" opacity=".8"/>
  <path d="M32 20 35.6 28.4 44 32 35.6 35.6 32 44 28.4 35.6 20 32 28.4 28.4Z" fill="#fff0a4" stroke="#a36b1d" stroke-width="1.3" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="3.5" fill="#e3a73b" stroke="#fff3b0" stroke-width=".9"/>
  <g clip-path="url(#face)"><rect class="glint" x="4" y="7" width="56" height="50" fill="url(#shine)"/></g>
 </g>
</svg>
